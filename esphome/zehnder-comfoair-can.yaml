substitutions:
  name: "zehnder-comfoair-can"
  device_name: ComfoAir
  filter_time: 5s
  filter_send_every: '1'
  filter_window_size: '3'
  can_tx_pin: GPIO22
  can_rx_pin: GPIO19

packages:

  remote_package:
    url: https://github.com/dan-s-github/zehnder-comfoair-can
    ref: main
    files:
      - packages/canbus.yml
      - packages/binary_sensors.yml
      - packages/button.yml
      - packages/select.yml
      - packages/sensors.yml
      - packages/switch.yml
      - packages/text_sensors.yml
      - packages/fan.yml
      - packages/climate.yml
      - packages/diagnostics.yml

esphome:
  name: ${name}
  friendly_name: Zehnder ComfoAir CAN
  comment: Zehnder ComfoAir Q350
  min_version: '2025.11.0'
  project:
    name: dan-s-github.zehnder-comfoair-can
    version: 1.0.0

esp32:
  variant: esp32
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true

# Enable logging
logger:
  level: INFO
  logs:
    canbus: INFO

external_components:
  - source: github://dan-s-github/zehnder-comfoair-can
    components: [ zehnder_comfoair_q  ]

# See docs: https://github.com/michaelarnauts/aiocomfoconnect/blob/master/docs/PROTOCOL-PDO.md
zehnder_comfoair_q:
  id: comfoair
  request_interval: 1h
  request_delay: 100ms
  request_ids: [16, 49, 54, 55, 65, 66, 67, 81, 82,
    117, 118, 119, 120, 121, 122, 128, 129, 130, 144, 145, 146, 192,
    209, 210, 211, 212, 213, 214, 215, 216, 217, 218,
    220, 221, 227, 274, 275, 276, 277, 278, 290, 291, 292, 293, 294]

# Enable Home Assistant API
api:
  encryption:
    key: "TUVw7zZSA/WDeNigYtLF9hVaNXU4g6GOWrkF2RnZYDw="

# Allow Over-The-Air updates
ota:
  platform: esphome

wifi:
  ssid: !secret iot_ssid
  password: !secret iot_password
