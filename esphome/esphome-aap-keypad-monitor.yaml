substitutions:
  name: "esphome-aap-keypad-monitor"
  friendly_name: ESPHome AAP Keypad Monitor
  comment: "Control your Arrowhead Alarm system using ESPHome."

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: ${comment}
  name_add_mac_suffix: false

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

logger:
  level: VERBOSE
  initial_level: INFO
  logs:
    crow_alarm_panel: VERBOSE
 
external_components:
  - components: [crow_alarm_panel]
    source: github://dan-s-github/esphome-components
    # source:
    #   type: git
    #   url: https://github.com/dan-s-github/esphome-components
    #   ref: main

select:
  platform: logger
  name: "Log level"
    
crow_alarm_panel:
  clock_pin: GPIO7
  data_pin: GPIO5
  # address: 4
  # code: !secret alarm_code

  keypads:
    - name: "AAP Keypad"
      address: 0
    - name: "ESPHome Keypad"
      address: 5
    - name: "Control 4 Keypad"
      address: 6
    - name: "IP Keypad"
      address: 7

api:
  encryption:
    key: !secret api_encryption_key

ota:
  platform: esphome

improv_serial:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "esphome-aap-keypad-fallback"
    password: !secret fallback_hotspot_password

captive_portal:

esp32_improv:
  authorizer: none

web_server:
