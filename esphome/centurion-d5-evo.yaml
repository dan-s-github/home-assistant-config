substitutions:
  name: "centurion-d5-evo"
  friendly_name: "Centurion D5 Evo"
  comment: "Control your Centurion D5 Evo gate motor remotely."

  relay_1_pin: GPIO21
  relay_2_pin: GPIO19
  relay_3_pin: GPIO18
  relay_4_pin: GPIO05
  led_pin: GPIO22

packages:
  remote_package:
    url: https://github.com/dan-s-github/centurion-d5-evo
    ref: main
    files: 
      - packages/diagnostics.yml
      - packages/gate_control.yml
      - packages/led_evaluator.yml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: ${comment}
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: '3.1'

# Enable logging
logger:
  level: INFO

# Enable Home Assistant API
api:
  encryption:
    key: "5wqUYCw5MwKhuU/c7KL2+JCCe9JIe57CmTuhYhQ/BYM="

# Allow Over-The-Air updates
ota:
  platform: esphome 
  
wifi:
  ssid: !secret iot_ssid
  password: !secret iot_password
  # manual_ip: 
  # Set this to the IP of the ESP
    # static_ip: 192.168.17.233
    # Set this to the IP address of the router. Often ends with .1
    # gateway: 192.168.17.1
    # The subnet of the network. 255.255.255.0 works for most home networks.
    # subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${name}-fallback"
    password: !secret fallback_hotspot_password

captive_portal:

