substitutions:
  name: "esphome-aap-alarm-interface"
  friendly_name: ESPHome AAP Alarm Interface
  comment: "Control your Arrowhead Alarm system using ESPHome."

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: ${comment}
  name_add_mac_suffix: false

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

# Enable logging
logger:
  level: DEBUG
  initial_level: INFO
  logs:
    crow_alarm_panel: DEBUG

external_components:
  - components: [crow_alarm_panel]
    # source: github://jallier/esphome-components@main
    # source: components
    # source:
    #   type: git
    #   url: https://github.com/jallier/esphome-components
    #   ref: main
    #   path: .
    source:
      type: git
      url: https://github.com/dan-s-github/esphome-components
      ref: dev
    refresh: 1min
    # source:
    #   type: local
    #   path: components

crow_alarm_panel:
  clock_pin: GPIO7
  data_pin: GPIO5
  address: 5

  keypads:
    # Optional: label other keypads for logging
    - name: "AAP Keypad"
      address: 0
    - name: "RS232 Keypad"
      address: 2
    - name: "ESPHome Monitor"
      address: 4
    - name: "ESPHome Keypad"
      address: 5
    - name: "Control 4 Keypad"
      address: 6
    - name: "IP Keypad"
      address: 7
  # on_message:
  #   - lambda: |-
  #       ESP_LOGI("crow_alarm_panel", "%02x - %s", type, format_hex_pretty(data).c_str());

  # Zones
binary_sensor:
  - platform: crow_alarm_panel
    device_class: motion
    icon: mdi:motion-sensor
    type: zone
    zone: 1
    name: "Entrance"

  - platform: crow_alarm_panel
    type: bypass
    zone: 1
    name: "Entrance Bypassed"

  - platform: crow_alarm_panel
    device_class: motion
    icon: mdi:motion-sensor
    type: zone
    zone: 2
    name: "Garage"

  - platform: crow_alarm_panel
    type: bypass
    zone: 2
    name: "Garage Bypassed"

  - platform: crow_alarm_panel
    device_class: garage_door
    type: zone
    zone: 3
    name: "Garage Door"

  - platform: crow_alarm_panel
    type: bypass
    zone: 3
    name: "Garage Door Bypassed"

  - platform: crow_alarm_panel
    device_class: motion
    icon: mdi:motion-sensor
    type: zone
    zone: 4
    name: "Guest Bedroom"

  - platform: crow_alarm_panel
    type: bypass
    zone: 4
    name: "Guest Bedroom Bypassed"

  - platform: crow_alarm_panel
    device_class: motion
    icon: mdi:motion-sensor
    type: zone
    zone: 5
    name: "Dining"

  - platform: crow_alarm_panel
    type: bypass
    zone: 5
    name: "Dining Bypassed"

  - platform: crow_alarm_panel
    device_class: motion
    icon: mdi:motion-sensor
    type: zone
    zone: 6
    name: "Master Bedroom"

  - platform: crow_alarm_panel
    type: bypass
    zone: 6
    name: "Master Bedroom Bypassed"

  - platform: crow_alarm_panel
    device_class: motion
    icon: mdi:motion-sensor
    type: zone
    zone: 7
    name: "Office"

  - platform: crow_alarm_panel
    type: bypass
    zone: 7
    name: "Office Bypassed"

  - platform: crow_alarm_panel
    device_class: smoke
    type: zone
    zone: 8
    name: "Smokes"

  - platform: crow_alarm_panel
    type: bypass
    zone: 8
    name: "Smokes Bypassed"

# Text sensor for armed state
text_sensor:
  - platform: crow_alarm_panel
    type: armed_state
    name: "Alarm Status"

alarm_control_panel:
  - platform: crow_alarm_panel
    name: "Crow Alarm"
    code: !secret alarm_code # Optional: default disarm code
    requires_code_to_arm: false # Optional: set true if your panel needs code to arm

# Buttons for keypad-driven actions
button:
  - platform: crow_alarm_panel
    type: arm_away
    name: "Arm Away"

  - platform: crow_alarm_panel
    type: arm_stay
    name: "Arm Stay"

  - platform: crow_alarm_panel
    type: disarm
    name: "Disarm"
    code: !secret alarm_code

  - platform: restart
    id: restart_button
    name: "Restart"
    entity_category: diagnostic
# Output state (read-only; write not implemented)
switch:
  - platform: crow_alarm_panel
    type: output
    output: 3
    name: "Gate"
  - platform: crow_alarm_panel
    type: output
    output: 4
    name: "Garage Door"

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

# Allow Over-The-Air updates
ota:
  platform: esphome

# Allow provisioning Wi-Fi via serial
improv_serial:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "esphome-aap-keypad-fallback"
    password: !secret fallback_hotspot_password

# In combination with the `ap` this allows the user
# to provision wifi credentials to the device via WiFi AP.
captive_portal:

# Sets up Bluetooth LE (Only on ESP32) to allow the user
# to provision wifi credentials to the device.
esp32_improv:
  authorizer: none

# To have a "next url" for improv serial
web_server:
