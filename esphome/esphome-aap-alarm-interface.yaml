substitutions:
  name: "esphome-aap-alarm-interface"
  friendly_name: ESPHome AAP Alarm Interface
  comment: "Control your Arrowhead Alarm system using ESPHome."

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: ${comment}
  name_add_mac_suffix: false

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

logger:
  level: DEBUG
  initial_level: INFO
  logs:
    crow_alarm_panel: DEBUG
    
external_components:
  - components: [crow_alarm_panel]
    # source: github://dan-s-github/esphome-components
    source: github://dan-s-github/esphome-components@dan-dev
    refresh: 1min
     
crow_alarm_panel:
  clock_pin: GPIO7
  data_pin: GPIO5
  address: 5
  code: !secret alarm_code

  keypads:
    - name: "AAP Keypad"
      address: 0
    - name: "ESPHome Keypad"
      address: 5
    - name: "Control 4 Keypad"
      address: 6
    - name: "IP Keypad"
      address: 7

  zones:
    - zone: 1
      name: "Entrance"
      device_class: motion
      icon: mdi:motion-sensor
    - zone: 2
      name: "Garage"
      device_class: motion
      icon: mdi:motion-sensor
    - zone: 3
      name: "Garage Door"
      device_class: garage_door
    - zone: 4
      name: "Guest Bedroom"
      device_class: motion
      icon: mdi:motion-sensor
    - zone: 5
      name: "Dining"
      device_class: motion
      icon: mdi:motion-sensor
    - zone: 6
      name: "Master Bedroom"
      device_class: motion
      icon: mdi:motion-sensor
    - zone: 7
      name: "Office"
      device_class: motion
      icon: mdi:motion-sensor
    - zone: 8
      name: "Smokes"
      device_class: smoke

text_sensor:
  - platform: crow_alarm_panel
    type: armed_state
    name: "Alarm Status"

alarm_control_panel:
  - platform: crow_alarm_panel
    name: "ESPHome AAP Alarm Panel"
    requires_code_to_arm: false

button:
  - platform: crow_alarm_panel
    type: arm_away
    name: "Arm Away"

  - platform: crow_alarm_panel
    type: arm_stay
    name: "Arm Stay"

  - platform: crow_alarm_panel
    type: disarm
    name: "Disarm"

  - platform: restart
    id: restart_button
    name: "Restart"
    entity_category: diagnostic

switch:
  - platform: crow_alarm_panel
    type: output
    output: 3
    name: "Gate"
  - platform: crow_alarm_panel
    type: output
    output: 4
    name: "Garage Door"

api:
  encryption:
    key: !secret api_encryption_key

ota:
  platform: esphome

improv_serial:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "esphome-aap-keypad-fallback"
    password: !secret fallback_hotspot_password

captive_portal:

esp32_improv:
  authorizer: none

web_server:
