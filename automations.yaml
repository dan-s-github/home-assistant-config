- id: '1690361756579'
  alias: AlphaESS Enable Grid Charging Battery
  description: ''
  triggers:
  - at: 02:00:00
    trigger: time
  - at: '16:00:00'
    trigger: time
  conditions:
  - alias: Confirm AL2002118050331_State of Charge is below Grid Charging Threshold
    condition: numeric_state
    entity_id: sensor.al2002118050331_instantaneous_battery_soc
    below: input_number.grid_charging_threshold
  actions:
  - data:
      enabled: true
      cp1start: 02:00
      cp1end: 05:00
      cp2start: '16:00'
      cp2end: '17:00'
      chargestopsoc: 100
      serial: AL2002118050331
    action: alphaess.setbatterycharge
  - data: {}
    target:
      entity_id: input_boolean.al2002118050331_grid_charging_battery
    action: input_boolean.turn_on
  mode: single
- id: '1690364695644'
  alias: AlphaESS Disable Grid Charging Battery
  description: ''
  triggers:
  - alias: When AL2002118050331_State of Charge is above Grid Charging Threshold
    entity_id:
    - sensor.al2002118050331_instantaneous_battery_soc
    above: input_number.grid_charging_threshold
    trigger: numeric_state
  - trigger: time
    at: 04:00:00
  - trigger: time
    at: '17:00:00'
  conditions:
  - condition: state
    entity_id: input_boolean.al2002118050331_grid_charging_battery
    state: 'on'
  actions:
  - data:
      enabled: false
      cp1start: 03:00
      cp1end: 04:00
      cp2start: '16:00'
      cp2end: '17:00'
      chargestopsoc: 50
      serial: AL2002118050331
    alias: 'Call a service ''Alpha ESS: Set Battery Charge'' off'
    action: alphaess.setbatterycharge
  - data: {}
    target:
      entity_id: input_boolean.al2002118050331_grid_charging_battery
    action: input_boolean.turn_off
  mode: single
