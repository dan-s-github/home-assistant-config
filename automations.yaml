- id: '1754195805593'
  alias: Battery Charge - Low Spot Price
  description: Enable battery charging when electricity spot price is below threshold
  triggers:
  - minutes: /15
    trigger: time_pattern
    enabled: false
  - entity_id:
    - sensor.em6_energy_price
    trigger: state
  conditions:
  - condition: time
    after: '18:00:00'
    before: 06:00:00
  - condition: numeric_state
    entity_id: sensor.em6_energy_price
    below: input_number.spot_price_charging_threshold
  - condition: numeric_state
    entity_id: sensor.al2002118050331_instantaneous_battery_soc
    below: input_number.grid_charging_threshold
  actions:
  - action: switch.turn_on
    metadata: {}
    target:
      entity_id: switch.al2002118050331_grid_charge_enabled
    data: {}
  - data:
      title: Battery Charging Started
      message: 'Spot price: ${{ states(''sensor.em6_energy_price'') }}/kWh - Charging
        enabled'
    action: notify.dan_signal
    enabled: false
  mode: single
  trace:
    stored_traces: 48
- id: '1754195830846'
  alias: Battery Charge - High Spot Price Stop
  description: Disable battery charging when spot price exceeds threshold
  triggers:
  - minutes: /15
    trigger: time_pattern
    enabled: false
  - entity_id:
    - sensor.em6_energy_price
    trigger: state
  conditions:
  - condition: numeric_state
    entity_id: sensor.em6_energy_price
    above: input_number.spot_price_stop_threshold
  - condition: state
    entity_id: switch.al2002118050331_grid_charge_enabled
    state:
    - 'on'
  actions:
  - action: switch.turn_off
    metadata: {}
    target:
      entity_id: switch.al2002118050331_grid_charge_enabled
    data: {}
  - data:
      title: Battery Charging Stopped
      message: 'Spot price: ${{ states(''sensor.em6_energy_price'') }}/kWh - Charging
        disabled'
    action: notify.dan_signal
    enabled: false
  mode: single
  trace:
    stored_traces: 48
- id: '1754195901077'
  alias: Battery Charge - Full Protection
  description: Stop charging when battery reaches maximum level
  triggers:
  - entity_id:
    - sensor.al2002118050331_instantaneous_battery_soc
    above: input_number.grid_charging_threshold
    trigger: numeric_state
  conditions:
  - condition: state
    entity_id: switch.al2002118050331_grid_charge_enabled
    state:
    - 'on'
  actions:
  - action: switch.turn_off
    metadata: {}
    target:
      entity_id: switch.al2002118050331_grid_charge_enabled
    data: {}
  - data:
      title: Battery Charging Complete
      message: Battery reached {{ states('sensor.al2002118050331_instantaneous_battery_soc')
        }}% - Charging stopped
    action: notify.dan_signal
    enabled: false
  mode: single
- id: '1760243072904'
  alias: Reload EM6
  description: Reloads EM6 Integration after a ha restart at xx:02 or xx:32 in the
    first hour after a restart
  triggers:
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - wait_template: '{{ now().minute == 2 or now().minute == 32 }}'
    continue_on_timeout: true
    timeout: 01:00:00
  - choose:
    - conditions:
      - condition: template
        value_template: wait.trigger.timeout
      sequence:
      - action: persistent_notification.create
        metadata: {}
        data:
          title: EM6 Integration Restart Timeout
          message: Timeout waiting for xx:02 or xx:32 minute mark to restart EM6 integration
          notification_id: em6_integration_restart_timeout
    default:
    - action: homeassistant.reload_config_entry
      data:
        entry_id: 01K7AT1F0KR8CRA7Y2PP1QN3GS
  mode: single
