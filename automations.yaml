- id: '1780559117026'
  alias: Reloads ElectricityInfo
  description: Reloads ElectricityInfo Integration after a HA restart, waiting for
    the next xx:x1 or xx:x6 minute mark (1 minute past each 5-minute price update)
    within the first hour after restart. Notifies if no such mark occurs within the
    hour.
  triggers:
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - wait_template: '{{ now().minute % 5 == 1 }}'
    continue_on_timeout: true
    timeout: 01:00:00
  - choose:
    - conditions:
      - condition: template
        value_template: wait.trigger.timeout
      sequence:
      - action: persistent_notification.create
        metadata: {}
        data:
          title: Electricityinfo Integration Restart Timeout
          message: Timeout waiting for the next xx:x1 or xx:x6 minute mark to restart
            Electricityinfo integration
          notification_id: electricityinfo_reload_timeout
    default:
    - action: homeassistant.reload_config_entry
      data:
        entry_id: 01KR5JS5RK2VH4W52RZPXW4PAT
  mode: single
