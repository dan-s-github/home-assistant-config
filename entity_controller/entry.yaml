---
entry_motion:
  sensor: binary_sensor.entry_motion
  sensor_type: duration
  sensor_resets_timer: true
  entity: light.entry_downlight
  delay: 30
  override: group.entry_motion_override
  service_data:
    brightness: 80
  night_mode:
    delay: 30
    service_data:
      brightness: 60
    start_time: "22:00:00" # required
    end_time: "07:00:00" # required
